name: MARSAD Daily Monitor

on:
  schedule:
    # 06:00 UTC daily — matches SCHEDULER_HOUR=6 in radar/config.py
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage: monitor | discover | alert | forecast | run-all"
        required: false
        default: run-all

permissions:
  contents: write

jobs:
  monitor:
    name: MARSAD pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MARSAD__flight_radar/requirements.txt

      - name: Install dependencies
        working-directory: MARSAD__flight_radar
        run: |
          pip install \
            requests \
            python-dotenv \
            pydantic \
            rich \
            pandas \
            numpy \
            google-search-results

      - name: Write .env from repository secrets
        working-directory: MARSAD__flight_radar
        run: |
          cat > .env <<'EOF'
          DATA_SOURCE=serpapi
          SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}
          SERPAPI_PRIORITY_ONLY=false
          RADAR_WINDOW_START=2027-03-15
          RADAR_WINDOW_END=2027-09-30
          ALERT_THRESHOLD_PCT=10
          ALERT_THRESHOLD_BUSINESS_USD=200
          ALERT_THRESHOLD_PREMIUM_ECONOMY_USD=100
          ALERT_DELIVERY=console_and_file
          DATA_DIR=data
          ALERTS_DIR=alerts
          FETCH_DELAY_MIN_SEC=3
          FETCH_DELAY_MAX_SEC=12
          MAX_REQUESTS_PER_SESSION=50
          LOG_LEVEL=INFO
          EOF

      - name: Run MARSAD pipeline stage
        working-directory: MARSAD__flight_radar
        run: |
          STAGE="${{ github.event.inputs.stage || 'run-all' }}"
          echo "Running stage: $STAGE"
          python -m radar.main "$STAGE"

      - name: Commit updated price store
        run: |
          git config user.name "MARSAD[bot]"
          git config user.email "noreply@github.com"
          git add MARSAD__flight_radar/data/flight_prices.json
          if git diff --cached --quiet; then
            echo "No price changes — nothing to commit"
          else
            git commit -m "marsad: price snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
