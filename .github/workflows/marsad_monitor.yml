name: MARSAD Daily Monitor

on:
  schedule:
    # 06:00 UTC daily — matches APScheduler default in radar/config.py
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run: monitor | discover | forecast | alert | run-all"
        required: false
        default: monitor

permissions:
  contents: write

jobs:
  monitor:
    name: Run MARSAD pipeline stage
    runs-on: ubuntu-latest
    # 24 series x ~60-90s/request (SerpApi rate-limit backoff included) run ~31min,
    # which exceeded the old 30min cap on every scheduled run since 2026-05-20 —
    # the job was cancelled mid-MONITOR every day and never reached the commit step.
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/charming-shannon-E6moy
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests python-dotenv pydantic rich
        working-directory: MARSAD__flight_radar

      - name: Write .env from secrets
        working-directory: MARSAD__flight_radar
        run: |
          cat > .env <<EOF
          DATA_SOURCE=serpapi
          SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}
          SERPAPI_PRIORITY_ONLY=false
          RADAR_WINDOW_START=2027-03-15
          RADAR_WINDOW_END=2027-09-30
          ALERT_THRESHOLD_PCT=10
          ALERT_THRESHOLD_BUSINESS_USD=200
          ALERT_THRESHOLD_PREMIUM_ECONOMY_USD=100
          ALERT_DELIVERY=console_and_file
          DATA_DIR=data
          ALERTS_DIR=alerts
          FETCH_DELAY_MIN_SEC=3
          FETCH_DELAY_MAX_SEC=12
          MAX_REQUESTS_PER_SESSION=50
          LOG_LEVEL=INFO
          EOF

      - name: Run stage
        working-directory: MARSAD__flight_radar
        run: |
          STAGE="${{ github.event.inputs.stage || 'monitor' }}"
          python -m radar.main "$STAGE"

      - name: Commit updated data store
        # Run even if "Run stage" was cancelled (e.g. hit timeout-minutes) so
        # whatever observations were appended before cancellation aren't lost —
        # schema_store.py writes append-only, so a partial run still has real data.
        if: always()
        run: |
          git config user.name "MARSAD"
          git config user.email "noreply@github.com"
          git add MARSAD__flight_radar/data/flight_prices.json
          if git diff --cached --quiet; then
            echo "No changes to store — nothing to commit"
          else
            git commit -m "marsad: daily monitor $(date -u +%Y-%m-%d)"
            git push
          fi
