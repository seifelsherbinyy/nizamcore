name: MARSAD Daily Monitor

on:
  schedule:
    # 06:00 UTC daily — matches APScheduler default in radar/config.py
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run: monitor | discover | forecast | alert | run-all"
        required: false
        default: monitor

permissions:
  contents: write

jobs:
  monitor:
    name: Run MARSAD pipeline stage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/charming-shannon-E6moy
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests python-dotenv pydantic rich
        working-directory: MARSAD__flight_radar

      - name: Write .env from secrets
        working-directory: MARSAD__flight_radar
        run: |
          cat > .env <<EOF
          DATA_SOURCE=serpapi
          SERPAPI_KEY=${{ secrets.SERPAPI_KEY }}
          # Priority-only trims each run to the 8 highest-priority destinations
          # instead of all 12 — SerpApi's free tier (250 searches/month) is
          # exhausted by a single full-matrix run, so this stretches quota
          # further. Still likely insufficient for daily coverage on the free
          # tier — see MARSAD__flight_radar/README.md SWAPPABLE_DEFAULT registry.
          SERPAPI_PRIORITY_ONLY=true
          RADAR_WINDOW_START=2027-03-15
          RADAR_WINDOW_END=2027-09-30
          ALERT_THRESHOLD_PCT=10
          ALERT_THRESHOLD_BUSINESS_USD=200
          ALERT_THRESHOLD_PREMIUM_ECONOMY_USD=100
          ALERT_DELIVERY=console_and_file
          DATA_DIR=data
          ALERTS_DIR=alerts
          FETCH_DELAY_MIN_SEC=3
          FETCH_DELAY_MAX_SEC=12
          MAX_REQUESTS_PER_SESSION=50
          LOG_LEVEL=INFO
          EOF

      - name: Run stage
        working-directory: MARSAD__flight_radar
        run: |
          STAGE="${{ github.event.inputs.stage || 'monitor' }}"
          python -m radar.main "$STAGE" 2>&1 | tee /tmp/marsad_run.log
          if grep -q "aborted_reason.*serpapi_quota_or_rate_limit_exhausted" /tmp/marsad_run.log; then
            {
              echo "### :warning: MARSAD run aborted early — rate limit / quota exhausted"
              echo "SerpApi rejected requests with 429 until the circuit breaker tripped."
              echo "No fresh price data was collected this run. Check the SerpApi dashboard quota."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated data store
        run: |
          git config user.name "MARSAD"
          git config user.email "noreply@github.com"
          git add MARSAD__flight_radar/data/flight_prices.json
          if git diff --cached --quiet; then
            echo "No changes to store — nothing to commit"
          else
            git commit -m "marsad: daily monitor $(date -u +%Y-%m-%d)"
            git push
          fi
