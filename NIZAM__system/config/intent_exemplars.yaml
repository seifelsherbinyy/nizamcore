# NIZAM intent_exemplars.yaml — starter set
# Pulled from Telegram-style brain-dump inputs + skill triggers.
# Marked as STARTER. Tune from real session traffic post-Phase-1.
# Updated: 2026-05-28 (NIZAM Next Plan v2 G12)

schema_version: 1.0.0
marked_as_starter: true
last_tuned_from_traffic: null   # set after Phase 1 round-trip
tuning_owner: Salman             # feedback loop fed via /feedback command

# Intent buckets. Each example feeds the LLM-router's few-shot prompt.

brainstorm:
  - "Let me dump for 10 minutes about the wealth pillar."
  - "I want to think out loud about Q3."
  - "Brain dump on whether to take the Cairo opportunity."
  - "/shura-brainstorm wealth"

redteam:
  - "Tear apart this idea: launch a paid product before Series A."
  - "Steelman the case for shutting down JADWAL."
  - "/naqd-grill my Q3 plan"
  - "What am I missing about the 10-yr plan?"

long_horizon:
  - "What does year 10 look like if I stay in Cairo?"
  - "/tariq-vision 15"
  - "Long War pillar refresh for assets."
  - "If I commit to medicine for the next 5 years, what does that lock in?"

tactical_plan:
  - "Plan the next quarter."
  - "/munawara-quarter-plan"
  - "Weekly battle map for the next 7 days."
  - "What's the 1-yr objective for body?"

weekly_synthesis:
  - "/hikmah-weekly"
  - "What did we learn this week?"
  - "Crystallize lessons from the last 7 EVENT_LEDGER entries."

intel_scout:
  - "Scan flight-radar for SUKOON-relevant news."
  - "/marsad-scan health policy"
  - "What's surfacing in academic medicine this week?"

biometric_log:
  - "HRV today was 38."
  - "Sleep score 65, energy 5/10."
  - "/badan-log"

family_record:
  - "Note about Dad's appointment Tuesday."
  - "Family budget thought."
  - "/ahel-note"
  # NOTE: strict_local_maximum — never routed through cloud models.

decision_log:
  - "Decision: defer Cairo move to Q4."
  - "/qarar-record"
  - "I've decided not to take the loan."

capture:
  - "Just thinking out loud."
  - "No idea where this goes."
  - "Random thought."
  - "/tafrigh-capture"
  - "Need to dump this before I forget."
