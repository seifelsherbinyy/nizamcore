[pytest]
testpaths =
    tools
    scripts
    NIZAM__system/config/fixtures
    NIZAM__system/governor/tests
    NIZAM__system/companion/tests
    NIZAM__system/relay/tests
    HIFZ__github_version_control/scripts
    MARSAD__flight_radar/tests
    HIKMAH__knowledge_index/delivery/tests
    HIKMAH__knowledge_index/message_generation/tests
python_files = test_*.py *_test.py
norecursedirs =
    .git
    .venv
    hermes-venv
    install-audit
    graphify-out
    MAKHZAN__archive
    Research_docs
addopts = --strict-config --strict-markers
markers =
    timeout: mark test as having a timeout (requires pytest-timeout plugin)
